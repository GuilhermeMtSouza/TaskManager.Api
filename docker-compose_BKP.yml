services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: taskmanager
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "8001:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d password"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - api_network


  api:
    build:
      context: ./TaskManager.Api
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - api_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

volumes:
  pgdata:

networks:
  api_network:
